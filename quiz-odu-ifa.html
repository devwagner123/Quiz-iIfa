<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ifáorí — Código Ético dos ODÚs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --green:#006400;
  --green2:#007a00;
  --green3:#005200;
  --yellow:#FFD700;
  --yellow2:#FFC200;
  --yellow-dim:rgba(255,215,0,0.18);
  --white:#FFFFFF;
  --white2:rgba(255,255,255,0.85);
  --white3:rgba(255,255,255,0.55);
  --white4:rgba(255,255,255,0.28);
  --dark:#002200;
  --dark2:#001800;
  --card-bg:rgba(0,80,0,0.35);
  --card-border:rgba(255,215,0,0.25);
  --shadow:rgba(255,215,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 15% 15%,rgba(0,100,0,0.5) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 85%,rgba(0,60,0,0.6) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(255,215,0,0.04) 0%,transparent 70%);
  pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;}

/* BANDEIRA decorativa no topo */
.flag-bar{width:100%;height:5px;background:linear-gradient(90deg,var(--green) 0%,var(--green) 40%,var(--yellow) 40%,var(--yellow) 60%,var(--green) 60%,var(--green) 100%);position:fixed;top:0;left:0;z-index:50;}

.screen{display:none;min-height:100vh;padding:5rem 1rem 2rem;flex-direction:column;align-items:center;}
.screen.active{display:flex;}

/* LOGO */
.logo{font-size:3.5rem;color:var(--yellow);text-shadow:0 0 30px var(--shadow);margin-bottom:0.6rem;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.main-title{font-family:'Cinzel',serif;font-size:clamp(1.5rem,5vw,2.8rem);font-weight:900;color:var(--white);letter-spacing:0.06em;line-height:1.2;text-align:center;margin-bottom:0.3rem;text-shadow:0 2px 12px rgba(0,0,0,0.5);}
.title-accent{color:var(--yellow);}
.subtitle{font-size:1rem;color:var(--white3);letter-spacing:0.14em;text-transform:uppercase;text-align:center;margin-bottom:1.2rem;}
.divider{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--yellow),transparent);margin:0.8rem auto;}
.w-full{width:100%;max-width:500px;}

/* SELETOR DE IDIOMA */
.lang-bar{display:flex;gap:0.5rem;justify-content:center;margin-bottom:1.5rem;}
.lang-btn{background:rgba(0,80,0,0.4);border:2px solid rgba(255,215,0,0.15);border-radius:50%;width:52px;height:52px;cursor:pointer;font-size:1.8rem;transition:all 0.2s;display:flex;align-items:center;justify-content:center;padding:0;}
.lang-btn:hover{border-color:var(--yellow);background:var(--yellow-dim);transform:scale(1.12);}
.lang-btn.active{background:rgba(255,215,0,0.18);border-color:var(--yellow);box-shadow:0 0 14px rgba(255,215,0,0.4);transform:scale(1.1);}

/* BOTÕES */
.btn{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border-radius:9px;cursor:pointer;transition:all 0.2s;border:none;padding:0.85rem 1.5rem;font-size:0.95rem;}
.btn-primary{background:linear-gradient(135deg,var(--green2),#00a000);color:var(--white);border:1px solid rgba(255,215,0,0.3);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,0.4);background:linear-gradient(135deg,#007a00,#00b800);}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
.btn-yellow{background:linear-gradient(135deg,#cc9900,var(--yellow));color:var(--dark);font-weight:800;box-shadow:0 4px 20px rgba(255,215,0,0.25);}
.btn-yellow:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(255,215,0,0.4);}
.btn-outline{background:none;border:1px solid var(--yellow);color:var(--yellow);}
.btn-outline:hover{background:var(--yellow-dim);}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,0.18);color:var(--white3);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.4);color:var(--white);}
.btn-full{width:100%;}
.btn-sm{padding:0.42rem 0.9rem;font-size:0.78rem;}

/* INPUTS */
.inp{background:rgba(0,60,0,0.5);border:1px solid rgba(255,215,0,0.28);border-radius:8px;padding:0.7rem 1rem;color:var(--white);font-family:'Inter',sans-serif;font-size:1.05rem;outline:none;transition:border-color 0.2s;width:100%;}
.inp:focus{border-color:var(--yellow);background:rgba(0,80,0,0.55);}
.inp::placeholder{color:rgba(255,255,255,0.28);}
.form-label{font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--white3);margin-bottom:0.28rem;display:block;font-weight:600;}
.gap-col{display:flex;flex-direction:column;gap:0.8rem;width:100%;max-width:500px;}

/* CARD */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:13px;padding:1.3rem;}

/* TABS */
.tabs{display:flex;gap:0.5rem;margin-bottom:1.2rem;width:100%;max-width:500px;}
.tab-btn{flex:1;padding:0.6rem;font-family:'Inter',sans-serif;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;border-radius:8px;cursor:pointer;transition:all 0.2s;border:1px solid rgba(255,215,0,0.18);background:rgba(0,60,0,0.4);color:var(--white3);}
.tab-btn.active{background:rgba(255,215,0,0.18);border-color:var(--yellow);color:var(--yellow);}
.tab-panel{display:none;width:100%;max-width:500px;flex-direction:column;gap:0.8rem;}
.tab-panel.active{display:flex;}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(0,20,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:1rem;}
.loading-overlay.hidden{display:none;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,215,0,0.15);border-top-color:var(--yellow);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:0.85rem;letter-spacing:0.18em;color:rgba(255,215,0,0.6);font-weight:600;text-transform:uppercase;}

/* LOBBY */
#screen-lobby{justify-content:flex-start;}
.player-greeting{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--yellow);text-align:center;margin-bottom:0.25rem;font-weight:700;}
.player-stats{font-size:0.9rem;color:var(--white3);text-align:center;margin-bottom:1.3rem;}
.levels-grid{display:flex;flex-direction:column;gap:0.7rem;width:100%;max-width:500px;margin-bottom:1.3rem;}
.level-card{border-radius:12px;padding:1.05rem 1.2rem;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden;}
.level-card.unlocked{background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.22);}
.level-card.unlocked:hover{background:rgba(0,100,0,0.5);border-color:var(--yellow);transform:translateX(5px);}
.level-card.locked{background:rgba(0,30,0,0.3);border:1px solid rgba(255,255,255,0.06);cursor:not-allowed;opacity:0.5;}
.lv-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem;}
.lv-name{font-family:'Cinzel',serif;font-size:0.98rem;font-weight:700;color:var(--yellow);}
.lv-name-locked{font-family:'Cinzel',serif;font-size:0.98rem;font-weight:700;color:rgba(255,255,255,0.25);}
.lv-badge{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.18rem 0.6rem;border-radius:20px;font-weight:700;}
.lv-badge.done{background:rgba(0,150,0,0.3);color:#7fff7f;border:1px solid #4CAF50;}
.lv-badge.open{background:rgba(255,215,0,0.12);color:var(--yellow);border:1px solid rgba(255,215,0,0.3);}
.lv-badge.lock{background:rgba(0,0,0,0.25);color:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.06);}
.lv-desc{font-size:0.85rem;color:var(--white3);}
.lv-bar-wrap{height:4px;background:rgba(255,215,0,0.08);border-radius:4px;margin-top:0.45rem;overflow:hidden;}
.lv-bar-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--yellow));border-radius:4px;}
.lv-best{font-size:0.73rem;color:rgba(255,215,0,0.45);margin-top:0.22rem;}
.lv-lock-icon{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:1.3rem;opacity:0.22;}
.lobby-actions{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:center;}

/* RANKING */
#screen-ranking{justify-content:flex-start;}
.ranking-list{width:100%;max-width:500px;}
.rank-item{display:flex;align-items:center;gap:0.75rem;padding:0.8rem 0.9rem;border-bottom:1px solid rgba(255,215,0,0.07);}
.rank-num{font-family:'Cinzel',serif;font-weight:900;font-size:0.95rem;min-width:26px;color:rgba(255,255,255,0.25);}
.rank-num.g1{color:#FFD700;}.rank-num.g2{color:#C0C0C0;}.rank-num.g3{color:#CD7F32;}
.rank-avatar{width:36px;height:36px;border-radius:50%;background:rgba(0,100,0,0.5);border:1px solid rgba(255,215,0,0.3);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:0.88rem;color:var(--yellow);flex-shrink:0;}
.rank-info{flex:1;}
.rank-name{font-family:'Cinzel',serif;font-size:0.92rem;font-weight:700;color:var(--white);}
.rank-sub{font-size:0.76rem;color:var(--white3);}
.rank-score-col{text-align:right;}
.rank-pts{font-family:'Cinzel',serif;font-size:1rem;color:var(--yellow);}
.rank-pct{font-size:0.73rem;color:var(--white3);}
.rank-empty{text-align:center;color:var(--white4);padding:2.5rem 1rem;font-size:0.92rem;}

/* QUIZ */
#screen-quiz{justify-content:flex-start;align-items:center;}
.quiz-header{background:rgba(0,70,0,0.5);border:1px solid rgba(255,215,0,0.18);border-radius:11px;padding:0.85rem 1.1rem;margin-bottom:0.85rem;width:100%;max-width:540px;}
.qh-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.55rem;}
.qh-player{font-size:0.88rem;color:var(--white2);font-weight:600;}
.qh-player span{font-size:1.05rem;font-weight:800;color:var(--yellow);}
.qh-counter{font-size:0.85rem;color:var(--white3);font-weight:600;}
.qh-row2{display:flex;align-items:center;justify-content:space-between;gap:0.4rem;}
.score-live{background:rgba(0,100,0,0.4);border:1px solid rgba(255,215,0,0.18);border-radius:20px;padding:0.24rem 0.8rem;font-size:0.82rem;color:var(--white2);font-weight:600;}
.global-timer{display:flex;align-items:center;gap:0.4rem;background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.22);border-radius:7px;padding:0.26rem 0.75rem;}
.gtimer-val{font-family:'Cinzel',serif;font-size:0.95rem;font-weight:700;color:var(--yellow);min-width:38px;}
.global-timer.urgent .gtimer-val{color:#ff4444;animation:blink 0.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.progress-wrap{height:4px;background:rgba(255,215,0,0.08);border-radius:4px;margin-bottom:0.85rem;overflow:hidden;width:100%;max-width:540px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--yellow));border-radius:4px;transition:width 0.4s ease;}

/* CARD PERGUNTA */
.question-card{background:rgba(0,70,0,0.45);border:1px solid rgba(255,215,0,0.22);border-radius:14px;padding:1.6rem 1.4rem;margin-bottom:0.9rem;text-align:center;width:100%;max-width:540px;}
.q-badge{display:inline-block;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,215,0,0.55);border:1px solid rgba(255,215,0,0.18);border-radius:20px;padding:0.15rem 0.85rem;margin-bottom:1.1rem;font-weight:600;}
.q-maxima{font-size:clamp(1.2rem,3.8vw,1.6rem);line-height:1.65;color:var(--white);font-style:italic;font-weight:300;}

/* OPÇÕES */
.options-list{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:0.9rem;width:100%;max-width:540px;}
.opt-btn{background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.2);border-radius:10px;padding:1rem 1.1rem;color:var(--white);font-family:'Inter',sans-serif;font-size:clamp(0.95rem,2.6vw,1.08rem);font-weight:600;cursor:pointer;text-align:left;transition:all 0.18s;display:flex;align-items:center;gap:0.7rem;line-height:1.3;width:100%;}
.opt-btn:hover:not(:disabled){border-color:var(--yellow);background:rgba(0,120,0,0.5);transform:translateX(4px);}
.opt-letter{font-weight:900;color:var(--yellow);font-size:0.9rem;min-width:22px;flex-shrink:0;}
.opt-btn.correct{background:rgba(0,120,0,0.5)!important;border-color:#4CAF50!important;color:#7fff7f;}
.opt-btn.wrong{background:rgba(120,0,0,0.4)!important;border-color:#ff4444!important;color:#ffaaaa;}
.opt-btn:disabled{cursor:default;}

.feedback-bar{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:0.92rem;font-weight:700;letter-spacing:0.04em;margin-bottom:0.8rem;opacity:0;padding:0.5rem 1rem;text-align:center;transition:opacity 0.22s;width:100%;max-width:540px;}
.feedback-bar.show{opacity:1;}
.feedback-bar.correct{background:rgba(0,120,0,0.35);color:#7fff7f;border:1px solid #4CAF50;}
.feedback-bar.wrong{background:rgba(120,0,0,0.3);color:#ffaaaa;border:1px solid #ff4444;}

/* RESULTADO */
#screen-result{justify-content:flex-start;}
.unlock-box{background:rgba(0,120,0,0.3);border:1px solid #4CAF50;border-radius:11px;padding:0.85rem 1.2rem;margin-bottom:1rem;text-align:center;width:100%;max-width:490px;}
.unlock-box p{color:#7fff7f;font-weight:700;font-size:0.92rem;letter-spacing:0.06em;}
.result-lv-badge{font-size:0.8rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,215,0,0.55);border:1px solid rgba(255,215,0,0.2);border-radius:20px;padding:0.2rem 1rem;margin-bottom:0.8rem;font-weight:600;}
.result-big{font-family:'Cinzel',serif;font-size:clamp(3rem,9vw,4.5rem);font-weight:900;color:var(--yellow);text-shadow:0 0 40px var(--shadow);line-height:1;}
.result-pct{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--white2);margin:0.4rem 0;}
.result-msg-box{background:rgba(0,70,0,0.4);border:1px solid rgba(255,215,0,0.18);border-radius:11px;padding:1.1rem 1.4rem;margin-bottom:1.2rem;text-align:center;width:100%;max-width:490px;}
.result-msg{font-size:1.08rem;line-height:1.68;color:var(--white);font-style:italic;}
.result-actions{display:flex;gap:0.65rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:490px;}

/* MISC */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.28s ease forwards;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake 0.32s ease;}
.mt1{margin-top:0.8rem;}.mt2{margin-top:1.4rem;}
.err-text{color:#ff8888;font-size:0.85rem;text-align:center;display:none;font-weight:600;}
</style>
</head>
<body>
<div class="flag-bar"></div>
<div id="app">

<!-- LOADING -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">CARREGANDO...</div>
</div>

<!-- ══ INÍCIO ══ -->
<div id="screen-start" class="screen active">
  <div class="logo">☽◯☾</div>
  <h1 class="main-title">CÓDIGO ÉTICO<br><span class="title-accent">DOS ODÚs IFÁ</span></h1>
  <p class="subtitle" id="lbl-subtitle">Ifáorí · Sistema de Estudo</p>
  <div class="divider"></div>

  <!-- SELETOR DE IDIOMA -->
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('pt')" id="lang-pt"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" fill="#009C3B"/><polygon points="60,6 114,40 60,74 6,40" fill="#FFDF00"/><circle cx="60" cy="40" r="22" fill="#002776"/><rect x="37" y="37" width="46" height="6" fill="white" rx="3"/></svg></button>
    <button class="lang-btn" onclick="setLang('es')" id="lang-es"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" fill="white"/><rect width="120" height="16" fill="#002A8F"/><rect y="32" width="120" height="16" fill="#002A8F"/><rect y="64" width="120" height="16" fill="#002A8F"/><polygon points="0,0 52,40 0,80" fill="#CC0001"/><polygon points="22,40 25,31 28,40 37,40 30,46 33,55 22,49 11,55 14,46 7,40" fill="white"/></svg></button>
    <button class="lang-btn" onclick="setLang('en')" id="lang-en"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" fill="#B22234"/><rect y="6" width="120" height="6" fill="white"/><rect y="18" width="120" height="6" fill="white"/><rect y="31" width="120" height="6" fill="white"/><rect y="43" width="120" height="6" fill="white"/><rect y="55" width="120" height="6" fill="white"/><rect y="68" width="120" height="6" fill="white"/><rect width="48" height="43" fill="#3C3B6E"/><text x="24" y="14" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★ ★</text><text x="24" y="24" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★</text><text x="24" y="34" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★ ★</text></svg></button>
  </div>

  <div class="tabs w-full">
    <button class="tab-btn active" id="tab-btn-login" onclick="window.switchTab('login')" data-i18n="tab_login">Entrar</button>
    <button class="tab-btn" id="tab-btn-reg" onclick="window.switchTab('register')" data-i18n="tab_register">Cadastrar</button>
  </div>

  <div id="tab-login" class="tab-panel active w-full">
    <div>
      <label class="form-label" data-i18n="label_name">Seu nome</label>
      <input id="login-name" class="inp" type="text" data-i18n-ph="ph_name" placeholder="Nome cadastrado">
    </div>
    <div>
      <label class="form-label" data-i18n="label_pin">Senha (4 dígitos)</label>
      <input id="login-pin" class="inp" type="password" inputmode="numeric" placeholder="••••" maxlength="4">
    </div>
    <button class="btn btn-yellow btn-full" onclick="window.doLogin()" data-i18n="btn_enter">ENTRAR</button>
    <div id="login-err" class="err-text"></div>
  </div>

  <div id="tab-register" class="tab-panel w-full">
    <div>
      <label class="form-label" data-i18n="label_fullname">Nome completo</label>
      <input id="reg-name" class="inp" type="text" data-i18n-ph="ph_fullname" placeholder="Ex: Wagner Silva" maxlength="30">
    </div>
    <div>
      <label class="form-label" data-i18n="label_pin">Senha (4 dígitos)</label>
      <input id="reg-pin" class="inp" type="password" inputmode="numeric" placeholder="••••" maxlength="4">
    </div>
    <button class="btn btn-primary btn-full" onclick="window.doRegister()" data-i18n="btn_register">CRIAR CONTA</button>
    <div id="reg-err" class="err-text"></div>
  </div>
</div>

<!-- ══ LOBBY ══ -->
<div id="screen-lobby" class="screen">
  <div class="logo" style="font-size:2.5rem;margin-bottom:0.4rem">☽◯☾</div>
  <div class="player-greeting" id="lobby-greeting">Bem-vindo!</div>
  <div class="player-stats" id="lobby-stats"></div>
  <div class="levels-grid" id="levels-grid"></div>
  <div class="lobby-actions">
    <button class="btn btn-outline btn-sm" onclick="window.showRanking()" data-i18n="btn_ranking">🏆 Ranking</button>
    <button class="btn btn-ghost btn-sm" onclick="window.doLogout()" data-i18n="btn_logout">Sair</button>
  </div>
</div>

<!-- ══ RANKING ══ -->
<div id="screen-ranking" class="screen">
  <div style="font-size:2.4rem;margin-bottom:0.5rem">🏆</div>
  <h2 class="main-title" style="font-size:1.6rem" data-i18n="title_ranking">Ranking Geral</h2>
  <div class="divider"></div>
  <div class="ranking-list" id="ranking-list"></div>
  <div class="mt2"><button class="btn btn-ghost btn-sm" onclick="window.showLobby()" data-i18n="btn_back">← Voltar</button></div>
</div>

<!-- ══ QUIZ ══ -->
<div id="screen-quiz" class="screen">

function t(key) { return T[LANG][key] || T['pt'][key] || key; }

function applyTranslations() {

  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');

}

const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const fmt=s=>`${String(0|s/60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showLoad(key='load_loading'){document.getElementById('loading-text').textContent=t(key);document.getElementById('loading').classList.remove('hidden');}
function hideLoad(){document.getElementById('loading').classList.add('hidden');}
function showErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block';}
function hideErr(id){document.getElementById(id).style.display='none';}

async function fbGet(name){const snap=await getDoc(doc(db,'players',name));return snap.exists()?snap.data():null;}
async function fbSave(data){await setDoc(doc(db,'players',data.name),data);}
async function fbAll(){const snap=await getDocs(collection(db,'players'));return snap.docs.map(d=>d.data());}
function defPlayer(name,pin){return {name,pin,totalCorrect:0,totalPlayed:0,bestPct:{},levelsDone:[],highestLevel:'awozito'};}

window.switchTab=function(tab){
  document.getElementById('tab-btn-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-btn-reg').classList.toggle('active', tab==='register');
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
};

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
window.doRegister=async function(){
  hideErr('reg-err');
  const name=document.getElementById('reg-name').value.trim();
  const pin=document.getElementById('reg-pin').value.trim();
  if(!name){showErr('reg-err',t('err_name'));return;}
  if(!/^\d{4}$/.test(pin)){showErr('reg-err',t('err_pin'));return;}
  showLoad('load_creating');
  try{
    const ex=await fbGet(name);
    if(ex){hideLoad();showErr('reg-err',t('err_exists'));return;}
    await fbSave(defPlayer(name,pin));
    hideLoad();
    document.getElementById('reg-name').value='';
    document.getElementById('reg-pin').value='';
    // switch to login
    switchTab('login');
    document.getElementById('login-name').value=name;
  }catch(e){hideLoad();showErr('reg-err',t('err_connect'));}
};

window.doLogin=async function(){
  hideErr('login-err');
  const name=document.getElementById('login-name').value.trim();
  const pin=document.getElementById('login-pin').value.trim();
  if(!name){showErr('login-err',t('err_name'));return;}
  if(!pin){showErr('login-err',t('err_pin'));return;}
  showLoad('load_verify');
  try{
    const p=await fbGet(name);
    if(!p){hideLoad();showErr('login-err',t('err_notfound'));return;}
    if(p.pin!==pin){hideLoad();showErr('login-err',t('err_wrongpin'));return;}
    CUR.player=p;hideLoad();showLobby();
  }catch(e){hideLoad();showErr('login-err',t('err_internet'));}
};

window.doLogout=function(){
  CUR.player=null;
  document.getElementById('login-name').value='';
  document.getElementById('login-pin').value='';
  show('screen-start');
};

window.showLobby=function(){

  const lvName=T[LANG].lv_names[lv>=0?lv:0];

  document.getElementById('lobby-stats').textContent=
    `${p.totalCorrect} ${t('lbl_hits')} · ${p.totalPlayed} ${t('lbl_plays')} · ${pct}% · ${t('lbl_level')} ${lvName}`;

  const grid=document.getElementById('levels-grid');

    const desc=T[LANG].lv_descs[idx];
    const qLabel=T[LANG].lv_questions[idx];
    const div=document.createElement('div');

    if(unlocked)div.onclick=()=>startLevel(lv2,idx);
    div.innerHTML=`
      <div class="lv-header">
        <span class="${unlocked?'lv-name':'lv-name-locked'}">${lv2.icon} ${nm} — ${qLabel}</span>
        <span class="lv-badge ${done?'done':unlocked?'open':'lock'}">${done?t('badge_done'):unlocked?t('badge_play'):t('badge_lock')}</span>
      </div>
      <div class="lv-desc" style="${unlocked?'':'color:rgba(255,255,255,0.2)'}">${desc}</div>
      ${best!=null?`<div class="lv-bar-wrap"><div class="lv-bar-fill" style="width:${best}%"></div></div><div class="lv-best">${t('lbl_best')} ${best}% · ${best===100?t('lbl_unlocked'):t('lbl_need100')}</div>`:''}
      ${!unlocked?'<span class="lv-lock-icon">🔒</span>':''}`;
    grid.appendChild(div);
  });
  show('screen-lobby');
};

function isUnlocked(idx,p){
  if(idx===0)return true;
  const prev=LEVELS_BASE[idx-1];
  return p.bestPct&&p.bestPct[prev.id]===100;
}

// ══════════════════════════════════════════
// RANKING
// ══════════════════════════════════════════
window.showRanking=async function(){
  showLoad('load_ranking');
  try{
    const all=await fbAll();
    hideLoad();
    all.sort((a,b)=>{
      if(b.totalCorrect!==a.totalCorrect)return b.totalCorrect-a.totalCorrect;
      const pa=a.totalPlayed>0?a.totalCorrect/a.totalPlayed:0;
      const pb=b.totalPlayed>0?b.totalCorrect/b.totalPlayed:0;
      return pb-pa;
    });
    const list=document.getElementById('ranking-list');
    if(!all.length){list.innerHTML=`<div class="rank-empty">—</div>`;}
    else{
      list.innerHTML=all.map((p,i)=>{
        const pct=p.totalPlayed>0?Math.round(p.totalCorrect/p.totalPlayed*100):0;
        const nc=i===0?'g1':i===1?'g2':i===2?'g3':'';
        const init=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        const lvIdx=LEVELS_BASE.findIndex(l=>l.id===p.highestLevel);
        const lvName=T[LANG].lv_names[lvIdx>=0?lvIdx:0];
        return `<div class="rank-item">
          <div class="rank-num ${nc}">${i+1}º</div>
          <div class="rank-avatar">${init}</div>
          <div class="rank-info">
            <div class="rank-name">${p.name}</div>
            <div class="rank-sub">${lvName} · ${p.totalPlayed} ${t('lbl_plays')}</div>
          </div>
          <div class="rank-score-col">
            <div class="rank-pts">${p.totalCorrect}</div>
            <div class="rank-pct">${pct}%</div>
          </div>
        </div>`;
      }).join('');
    }
    show('screen-ranking');
  }catch(e){hideLoad();alert(t('err_internet'));}
};

// ══════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════
function startLevel(lv,idx){
  CUR.level={...lv,idx};
  CUR.qs=sh([...DB]).slice(0,lv.questions);
  CUR.qi=0;CUR.score=0;CUR.startMs=Date.now();
  if(CUR.tmr)clearInterval(CUR.tmr);
  CUR.tmr=setInterval(()=>{
    const s=Math.floor((Date.now()-CUR.startMs)/1000);
    document.getElementById('gtimer-val').textContent=fmt(s);
    document.getElementById('global-timer').classList.toggle('urgent',s>300);
  },1000);
  loadQ();show('screen-quiz');
}

function wrongOpts(co){
  return sh([...Array(16).keys()].filter(i=>i!==co)).slice(0,3)
    .map(odu=>sh(DB.filter(d=>d.o===odu))[0]);
}

function loadQ(){
  if(CUR.qi>=CUR.qs.length){finishQuiz();return;}
  const q=CUR.qs[CUR.qi];
  const total=CUR.qs.length;
  document.getElementById('qh-player').textContent=CUR.player.name;
  document.getElementById('qh-counter').textContent=`${CUR.qi+1} / ${total}`;
  document.getElementById('score-live').textContent=`✓ ${CUR.score}`;
  document.getElementById('progress-fill').style.width=`${(CUR.qi/total)*100}%`;
  document.getElementById('q-badge').textContent=t('q_badge');
  const card=document.getElementById('question-card');
  card.className='question-card fade-in';void card.offsetWidth;
  document.getElementById('q-maxima').textContent=`"${q.t}"`;
  const wrongs=wrongOpts(q.o);
  const allOpts=sh([{c:q.c,o:q.o},...wrongs]);
  const letters=['A','B','C','D'];
  document.getElementById('options-list').innerHTML=allOpts.map((opt,i)=>`
    <button class="opt-btn" data-correct="${opt.c===q.c}" onclick="window.pick(this,'${q.c.replace(/'/g,"\\'")}',${q.o})">
      <span class="opt-letter">${letters[i]})</span>${opt.c}
    </button>`).join('');
  document.getElementById('feedback-bar').className='feedback-bar';
  document.getElementById('feedback-bar').textContent='';
  document.getElementById('btn-next').style.display='none';
  document.getElementById('btn-next').textContent=t('btn_next');
}

window.pick=function(btn,cc,co){
  if(document.getElementById('btn-next').style.display==='block')return;
  const ok=btn.dataset.correct==='true';
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct');});
  if(!ok){btn.classList.add('wrong');btn.classList.add('shake');}
  if(ok){CUR.score++;document.getElementById('score-live').textContent=`✓ ${CUR.score}`;}
  const fb=document.getElementById('feedback-bar');
  if(ok){fb.className='feedback-bar correct show';fb.textContent=`${t('lbl_correct_fb')} (${ODUS[co].name})`;}
  else{fb.className='feedback-bar wrong show';fb.textContent=`${t('lbl_wrong_fb')} ${cc} — ${ODUS[co].name}`;}
  document.getElementById('btn-next').style.display='block';
};

window.nextQ=function(){CUR.qi++;loadQ();};

async function finishQuiz(){
  if(CUR.tmr){clearInterval(CUR.tmr);CUR.tmr=null;}
  const total=CUR.qs.length,score=CUR.score;
  const pct=Math.round(score/total*100);
  const lv=CUR.level,p=CUR.player;
  p.totalCorrect=(p.totalCorrect||0)+score;
  p.totalPlayed=(p.totalPlayed||0)+total;
  if(!p.bestPct)p.bestPct={};
  if(p.bestPct[lv.id]==null||pct>p.bestPct[lv.id])p.bestPct[lv.id]=pct;
  if(!p.levelsDone)p.levelsDone=[];
  if(pct===100&&!p.levelsDone.includes(lv.id))p.levelsDone.push(lv.id);
  const lvIdx=lv.idx;
  let newUnlock=null;
  if(pct===100&&lvIdx<LEVELS_BASE.length-1){
    const nxt=LEVELS_BASE[lvIdx+1];
    if(!isUnlocked(lvIdx+1,p))newUnlock={...nxt,idx:lvIdx+1};
  }
  const lvOrder=LEVELS_BASE.map(l=>l.id);
  if(lvIdx>lvOrder.indexOf(p.highestLevel||'awozito'))p.highestLevel=lv.id;
  CUR.player=p;
  showLoad('load_saving');
  try{await fbSave(p);}catch(e){}
  hideLoad();
  const msgs=T[LANG].pct_msgs;
  const msgIdx=PCT_RANGES.findIndex(r=>pct>=r.min&&pct<=r.max);
  const msg=msgs[msgIdx>=0?msgIdx:msgs.length-1];
  document.getElementById('result-lv-badge').textContent=`${lv.icon} ${T[LANG].lv_names[lvIdx]}`;
  document.getElementById('result-big').textContent=`${score}/${total}`;
  document.getElementById('result-pct').textContent=`${pct}%`;
  document.getElementById('result-msg').textContent=msg;
  const ub=document.getElementById('unlock-box');
  if(newUnlock){
    ub.style.display='block';
    document.getElementById('unlock-name').textContent=`${newUnlock.icon} ${T[LANG].lv_names[newUnlock.idx]}`;
    document.querySelector('#unlock-box p[data-i18n]').textContent=t('unlock_msg');
  } else ub.style.display='none';
  document.getElementById('btn-retry').textContent=t('btn_retry');
  document.getElementById('btn-lobby').textContent=t('btn_lobby');
  show('screen-result');
}

window.retryLevel=function(){if(CUR.level)startLevel(CUR.level,CUR.level.idx);};

// INIT
applyTranslations();

</script>
