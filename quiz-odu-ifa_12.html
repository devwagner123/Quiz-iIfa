<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ifáorí — Código Ético dos ODÚs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --green:#006400;--green2:#007a00;--yellow:#FFD700;
  --yellow-dim:rgba(255,215,0,0.18);--white:#FFFFFF;
  --white2:rgba(255,255,255,0.85);--white3:rgba(255,255,255,0.55);
  --dark:#002200;--dark2:#001800;
  --shadow:rgba(255,215,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(0,100,0,0.5) 0%,transparent 50%),radial-gradient(ellipse at 85% 85%,rgba(0,60,0,0.6) 0%,transparent 50%);pointer-events:none;z-index:0;}
.flag-bar{width:100%;height:5px;background:linear-gradient(90deg,#009C3B 0%,#009C3B 40%,#FFD700 40%,#FFD700 60%,#009C3B 60%,#009C3B 100%);position:fixed;top:0;left:0;z-index:50;}
#app{position:relative;z-index:1;}
.screen{display:none;min-height:100vh;padding:4.5rem 1rem 2rem;flex-direction:column;align-items:center;}
.screen.active{display:flex;}
.logo{font-size:3.2rem;color:var(--yellow);text-shadow:0 0 30px var(--shadow);margin-bottom:0.6rem;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.main-title{font-family:'Cinzel',serif;font-size:clamp(1.5rem,5vw,2.8rem);font-weight:900;color:var(--white);letter-spacing:0.06em;line-height:1.2;text-align:center;margin-bottom:0.3rem;}
.title-accent{color:var(--yellow);}
.subtitle{font-size:1rem;color:var(--white3);letter-spacing:0.14em;text-transform:uppercase;text-align:center;margin-bottom:1.2rem;}
.divider{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--yellow),transparent);margin:0.8rem auto;}
.w-full{width:100%;max-width:500px;}
.lang-bar{display:flex;gap:0.8rem;justify-content:center;margin-bottom:1.5rem;}
.lang-btn{background:none;border:2px solid rgba(255,215,0,0.2);border-radius:8px;width:74px;height:50px;cursor:pointer;transition:all 0.22s;display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden;}
.lang-btn:hover{border-color:var(--yellow);transform:scale(1.08);}
.lang-btn.active{border-color:var(--yellow);box-shadow:0 0 16px rgba(255,215,0,0.45);transform:scale(1.06);}
.lang-btn svg{width:100%;height:100%;display:block;border-radius:4px;}
.btn{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border-radius:9px;cursor:pointer;transition:all 0.2s;border:none;padding:0.85rem 1.5rem;font-size:0.95rem;}
.btn-yellow{background:linear-gradient(135deg,#cc9900,var(--yellow));color:#001800;font-weight:800;}
.btn-yellow:hover{transform:translateY(-2px);}
.btn-green{background:linear-gradient(135deg,var(--green2),#00a000);color:var(--white);border:1px solid rgba(255,215,0,0.3);}
.btn-green:hover{transform:translateY(-2px);}
.btn-outline{background:none;border:1px solid var(--yellow);color:var(--yellow);}
.btn-outline:hover{background:var(--yellow-dim);}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,0.18);color:var(--white3);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.4);color:var(--white);}
.btn-full{width:100%;}
.btn-sm{padding:0.42rem 0.9rem;font-size:0.78rem;}
.inp{background:rgba(0,60,0,0.5);border:1px solid rgba(255,215,0,0.28);border-radius:8px;padding:0.7rem 1rem;color:var(--white);font-family:'Inter',sans-serif;font-size:1.05rem;outline:none;transition:border-color 0.2s;width:100%;}
.inp:focus{border-color:var(--yellow);}
.inp::placeholder{color:rgba(255,255,255,0.28);}
.form-label{font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white3);margin-bottom:0.28rem;display:block;font-weight:600;}
.err-msg{color:#ff8888;font-size:0.88rem;text-align:center;font-weight:600;min-height:1.4rem;margin-top:0.3rem;}
.ok-msg{color:#7fff7f;font-size:0.88rem;text-align:center;font-weight:600;min-height:1.4rem;margin-top:0.3rem;}
.tabs{display:flex;gap:0.5rem;margin-bottom:1.2rem;width:100%;max-width:500px;}
.tab-btn{flex:1;padding:0.65rem;font-family:'Inter',sans-serif;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;border-radius:8px;cursor:pointer;transition:all 0.2s;border:1px solid rgba(255,215,0,0.2);background:rgba(0,60,0,0.4);color:var(--white3);}
.tab-btn.active{background:rgba(255,215,0,0.18);border-color:var(--yellow);color:var(--yellow);}
.tab-panel{display:none;width:100%;max-width:500px;flex-direction:column;gap:0.8rem;}
.tab-panel.active{display:flex;}
.loading-overlay{position:fixed;inset:0;background:rgba(0,20,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:1rem;}
.loading-overlay.show{display:flex;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,215,0,0.15);border-top-color:var(--yellow);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:0.88rem;letter-spacing:0.18em;color:rgba(255,215,0,0.7);font-weight:600;text-transform:uppercase;}
.player-greeting{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--yellow);text-align:center;margin-bottom:0.25rem;font-weight:700;}
.player-stats{font-size:0.88rem;color:var(--white3);text-align:center;margin-bottom:1.3rem;}
.levels-grid{display:flex;flex-direction:column;gap:0.7rem;width:100%;max-width:500px;margin-bottom:1.3rem;}
.lv-card{border-radius:12px;padding:1rem 1.2rem;transition:all 0.22s;position:relative;overflow:hidden;}
.lv-card.open{background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.22);cursor:pointer;}
.lv-card.open:hover{background:rgba(0,100,0,0.5);border-color:var(--yellow);transform:translateX(5px);}
.lv-card.locked{background:rgba(0,30,0,0.3);border:1px solid rgba(255,255,255,0.06);opacity:0.5;cursor:not-allowed;}
.lv-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem;}
.lv-name{font-family:'Cinzel',serif;font-size:0.98rem;font-weight:700;color:var(--yellow);}
.lv-name-locked{font-family:'Cinzel',serif;font-size:0.98rem;font-weight:700;color:rgba(255,255,255,0.25);}
.lv-badge{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.18rem 0.6rem;border-radius:20px;font-weight:700;}
.badge-done{background:rgba(0,150,0,0.3);color:#7fff7f;border:1px solid #4CAF50;}
.badge-open{background:rgba(255,215,0,0.12);color:var(--yellow);border:1px solid rgba(255,215,0,0.3);}
.badge-lock{background:rgba(0,0,0,0.25);color:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.06);}
.lv-desc{font-size:0.85rem;color:var(--white3);}
.lv-bar-wrap{height:4px;background:rgba(255,215,0,0.08);border-radius:4px;margin-top:0.45rem;overflow:hidden;}
.lv-bar-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--yellow));border-radius:4px;}
.lv-best{font-size:0.73rem;color:rgba(255,215,0,0.45);margin-top:0.22rem;}
.lv-lock-icon{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:1.3rem;opacity:0.22;}
.lobby-actions{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:center;}
.ranking-list{width:100%;max-width:500px;}
.rank-item{display:flex;align-items:center;gap:0.75rem;padding:0.8rem 0.9rem;border-bottom:1px solid rgba(255,215,0,0.07);}
.rank-num{font-family:'Cinzel',serif;font-weight:900;font-size:0.95rem;min-width:26px;color:rgba(255,255,255,0.25);}
.rank-num.g1{color:#FFD700;}.rank-num.g2{color:#C0C0C0;}.rank-num.g3{color:#CD7F32;}
.rank-avatar{width:36px;height:36px;border-radius:50%;background:rgba(0,100,0,0.5);border:1px solid rgba(255,215,0,0.3);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:0.88rem;color:var(--yellow);flex-shrink:0;}
.rank-info{flex:1;}
.rank-name-el{font-family:'Cinzel',serif;font-size:0.92rem;font-weight:700;}
.rank-sub{font-size:0.76rem;color:var(--white3);}
.rank-pts{font-family:'Cinzel',serif;font-size:1rem;color:var(--yellow);}
.rank-pct{font-size:0.73rem;color:var(--white3);}
.quiz-header{background:rgba(0,70,0,0.5);border:1px solid rgba(255,215,0,0.18);border-radius:11px;padding:0.85rem 1.1rem;margin-bottom:0.85rem;width:100%;max-width:540px;}
.qh-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.55rem;}
.qh-player{font-size:0.88rem;color:var(--white2);font-weight:600;}
.qh-player span{font-size:1.05rem;font-weight:800;color:var(--yellow);}
.qh-counter{font-size:0.85rem;color:var(--white3);font-weight:600;}
.qh-row2{display:flex;align-items:center;justify-content:space-between;}
.score-live{background:rgba(0,100,0,0.4);border:1px solid rgba(255,215,0,0.18);border-radius:20px;padding:0.24rem 0.8rem;font-size:0.82rem;color:var(--white2);font-weight:600;}
.gtimer{display:flex;align-items:center;gap:0.4rem;background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.22);border-radius:7px;padding:0.26rem 0.75rem;}
.gtimer-val{font-family:'Cinzel',serif;font-size:0.95rem;font-weight:700;color:var(--yellow);min-width:38px;}
.gtimer.urgent .gtimer-val{color:#ff4444;animation:blink 0.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.progress-wrap{height:4px;background:rgba(255,215,0,0.08);border-radius:4px;margin-bottom:0.85rem;overflow:hidden;width:100%;max-width:540px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--yellow));border-radius:4px;transition:width 0.4s ease;}
.question-card{background:rgba(0,70,0,0.45);border:1px solid rgba(255,215,0,0.22);border-radius:14px;padding:1.6rem 1.4rem;margin-bottom:0.9rem;text-align:center;width:100%;max-width:540px;}
.q-badge{display:inline-block;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,215,0,0.55);border:1px solid rgba(255,215,0,0.18);border-radius:20px;padding:0.15rem 0.85rem;margin-bottom:1.1rem;font-weight:600;}
.q-maxima{font-size:clamp(1.2rem,3.8vw,1.6rem);line-height:1.65;color:var(--white);font-style:italic;font-weight:300;}
.options-list{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:0.9rem;width:100%;max-width:540px;}
.opt-btn{background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.2);border-radius:10px;padding:1rem 1.1rem;color:var(--white);font-family:'Inter',sans-serif;font-size:clamp(0.95rem,2.6vw,1.08rem);font-weight:600;cursor:pointer;text-align:left;transition:all 0.18s;display:flex;align-items:center;gap:0.7rem;line-height:1.3;width:100%;}
.opt-btn:hover:not(:disabled){border-color:var(--yellow);background:rgba(0,120,0,0.5);transform:translateX(4px);}
.opt-letter{font-weight:900;color:var(--yellow);font-size:0.9rem;min-width:22px;flex-shrink:0;}
.opt-btn.correct{background:rgba(0,120,0,0.5)!important;border-color:#4CAF50!important;color:#7fff7f;}
.opt-btn.wrong{background:rgba(120,0,0,0.4)!important;border-color:#ff4444!important;color:#ffaaaa;}
.opt-btn:disabled{cursor:default;}
.feedback-bar{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:0.92rem;font-weight:700;margin-bottom:0.8rem;opacity:0;padding:0.5rem 1rem;text-align:center;transition:opacity 0.22s;width:100%;max-width:540px;}
.feedback-bar.show{opacity:1;}
.feedback-bar.correct{background:rgba(0,120,0,0.35);color:#7fff7f;border:1px solid #4CAF50;}
.feedback-bar.wrong{background:rgba(120,0,0,0.3);color:#ffaaaa;border:1px solid #ff4444;}
.unlock-box{background:rgba(0,120,0,0.3);border:1px solid #4CAF50;border-radius:11px;padding:0.85rem 1.2rem;margin-bottom:1rem;text-align:center;width:100%;max-width:490px;}
.unlock-box p{color:#7fff7f;font-weight:700;font-size:0.92rem;}
.result-lv{font-size:0.8rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,215,0,0.55);border:1px solid rgba(255,215,0,0.2);border-radius:20px;padding:0.2rem 1rem;margin-bottom:0.8rem;font-weight:600;}
.result-big{font-family:'Cinzel',serif;font-size:clamp(3rem,9vw,4.5rem);font-weight:900;color:var(--yellow);line-height:1;}
.result-pct{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--white2);margin:0.4rem 0;}
.result-msg-box{background:rgba(0,70,0,0.4);border:1px solid rgba(255,215,0,0.18);border-radius:11px;padding:1.1rem 1.4rem;margin-bottom:1.2rem;text-align:center;width:100%;max-width:490px;}
.result-msg{font-size:1.08rem;line-height:1.68;color:var(--white);font-style:italic;}
.result-actions{display:flex;gap:0.65rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:490px;}
.admin-card{background:rgba(0,80,0,0.4);border:1px solid rgba(255,215,0,0.2);border-radius:10px;padding:0.9rem 1rem;margin-bottom:0.6rem;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;}
.admin-card-name{font-family:'Cinzel',serif;font-weight:700;font-size:1rem;color:white;}
.admin-btns{display:flex;gap:0.5rem;}
.btn-approve{background:#006400;border:1px solid #4CAF50;color:#7fff7f;border-radius:7px;padding:0.4rem 0.9rem;cursor:pointer;font-weight:700;font-size:0.85rem;}
.btn-reject{background:rgba(120,0,0,0.4);border:1px solid #ff4444;color:#ffaaaa;border-radius:7px;padding:0.4rem 0.9rem;cursor:pointer;font-weight:700;font-size:0.85rem;}
.section-title{font-family:'Cinzel',serif;font-size:0.85rem;letter-spacing:0.15em;color:rgba(255,215,0,0.6);text-transform:uppercase;margin:1rem 0 0.6rem;width:100%;max-width:500px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.28s ease forwards;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake 0.32s ease;}
.mt2{margin-top:1.4rem;}
</style>
</head>
<body>
<div class="flag-bar"></div>
<div id="app">

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="load-txt" id="load-txt">CARREGANDO...</div>
</div>

<!-- INÍCIO -->
<div id="screen-start" class="screen active">
  <div class="logo">☽◯☾</div>
  <h1 class="main-title">CÓDIGO ÉTICO<br><span class="title-accent">DOS ODÚs IFÁ</span></h1>
  <p class="subtitle">Ifáorí · Sistema de Estudo</p>
  <div class="divider"></div>
  <div class="lang-bar">
    <button class="lang-btn active" id="lang-pt" onclick="setLang('pt')">
      <svg viewBox="0 0 120 80"><rect width="120" height="80" fill="#009C3B"/><polygon points="60,6 114,40 60,74 6,40" fill="#FFDF00"/><circle cx="60" cy="40" r="22" fill="#002776"/><rect x="37" y="37" width="46" height="6" fill="white" rx="3"/></svg>
    </button>
    <button class="lang-btn" id="lang-es" onclick="setLang('es')">
      <svg viewBox="0 0 120 80"><rect width="120" height="80" fill="white"/><rect width="120" height="16" fill="#002A8F"/><rect y="32" width="120" height="16" fill="#002A8F"/><rect y="64" width="120" height="16" fill="#002A8F"/><polygon points="0,0 52,40 0,80" fill="#CC0001"/><polygon points="22,40 25,31 28,40 37,40 30,46 33,55 22,49 11,55 14,46 7,40" fill="white"/></svg>
    </button>
    <button class="lang-btn" id="lang-en" onclick="setLang('en')">
      <svg viewBox="0 0 120 80"><rect width="120" height="80" fill="#B22234"/><rect y="6" width="120" height="6" fill="white"/><rect y="18" width="120" height="6" fill="white"/><rect y="31" width="120" height="6" fill="white"/><rect y="43" width="120" height="6" fill="white"/><rect y="55" width="120" height="6" fill="white"/><rect y="68" width="120" height="6" fill="white"/><rect width="48" height="43" fill="#3C3B6E"/><text x="24" y="14" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★ ★</text><text x="24" y="25" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★</text><text x="24" y="35" text-anchor="middle" font-size="9" fill="white">★ ★ ★ ★ ★</text></svg>
    </button>
  </div>
  <div class="tabs w-full">
    <button class="tab-btn active" id="tbLogin" onclick="switchTab('login')">Entrar</button>
    <button class="tab-btn" id="tbReg" onclick="switchTab('register')">Cadastrar</button>
    <button class="tab-btn" id="tbAdmin" onclick="switchTab('admin')">Admin</button>
  </div>
  <div id="panelLogin" class="tab-panel active w-full">
    <label class="form-label">SEU NOME</label>
    <input id="login-name" class="inp" type="text" placeholder="Nome cadastrado">
    <label class="form-label">SENHA (4 DÍGITOS)</label>
    <input id="login-pin" class="inp" type="password" inputmode="numeric" placeholder="••••" maxlength="4">
    <button class="btn btn-yellow btn-full" onclick="doLogin()">ENTRAR</button>
    <div class="err-msg" id="login-err"></div>
  </div>
  <div id="panelReg" class="tab-panel w-full">
    <label class="form-label">NOME COMPLETO</label>
    <input id="reg-name" class="inp" type="text" placeholder="Ex: Wagner Silva" maxlength="30">
    <label class="form-label">SENHA (4 DÍGITOS)</label>
    <input id="reg-pin" class="inp" type="password" inputmode="numeric" placeholder="••••" maxlength="4">
    <button class="btn btn-green btn-full" onclick="doRegister()">CRIAR CONTA</button>
    <div class="err-msg" id="reg-err"></div>
    <div class="ok-msg" id="reg-ok"></div>
  </div>
  <div id="panelAdmin" class="tab-panel w-full">
    <label class="form-label">SENHA ADMIN</label>
    <input id="admin-pin" class="inp" type="password" placeholder="••••••" maxlength="10">
    <button class="btn btn-green btn-full" onclick="doAdminLogin()">PAINEL ADMIN</button>
    <div class="err-msg" id="admin-err"></div>
  </div>
</div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen">
  <div class="logo" style="font-size:2.5rem;margin-bottom:0.4rem">☽◯☾</div>
  <div class="player-greeting" id="lobby-name">Bem-vindo!</div>
  <div class="player-stats" id="lobby-stats"></div>
  <div class="levels-grid" id="levels-grid"></div>
  <div class="lobby-actions">
    <button class="btn btn-outline btn-sm" onclick="showRanking()">🏆 Ranking</button>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
  </div>
</div>

<!-- RANKING -->
<div id="screen-ranking" class="screen">
  <div style="font-size:2.4rem;margin-bottom:0.5rem">🏆</div>
  <h2 class="main-title" style="font-size:1.6rem">Ranking Geral</h2>
  <div class="divider"></div>
  <div class="ranking-list" id="ranking-list"></div>
  <div class="mt2"><button class="btn btn-ghost btn-sm" onclick="showLobby()">← Voltar</button></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div style="font-size:2rem;margin-bottom:0.3rem">🔐</div>
  <h2 class="main-title" style="font-size:1.5rem;margin-bottom:0.3rem">Painel Admin</h2>
  <div class="divider"></div>
  <div class="section-title" id="admin-pending-title">⏳ Aguardando Aprovação</div>
  <div id="admin-pending" style="width:100%;max-width:500px;"></div>
  <div class="section-title" id="admin-approved-title">✓ Aprovados</div>
  <div id="admin-approved" style="width:100%;max-width:500px;margin-bottom:1.5rem;"></div>
  <button class="btn btn-ghost btn-sm" onclick="showScreen('screen-start')">← Voltar</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen" style="align-items:center;">
  <div class="quiz-header">
    <div class="qh-row1">
      <div class="qh-player" id="qh-name">Jogador: <span>—</span></div>
      <div class="qh-counter" id="qh-counter">1/20</div>
    </div>
    <div class="qh-row2">
      <div class="score-live" id="score-live">✓ 0</div>
      <div class="gtimer" id="gtimer">⏱ <span class="gtimer-val" id="gtimer-val">00:00</span></div>

var CUR={player:null,level:null,lvIdx:0,qs:[],qi:0,score:0,startMs:0,tmr:null};

function sh(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function showLoad(txt){document.getElementById('load-txt').textContent=txt||'CARREGANDO...';document.getElementById('loading').classList.add('show');}
function hideLoad(){document.getElementById('loading').classList.remove('show');}
function setErr(id,msg){var el=document.getElementById(id);if(el)el.textContent=msg||'';}
function setOk(id,msg){var el=document.getElementById(id);if(el)el.textContent=msg||'';}

function setLang(l){
  ['pt','es','en'].forEach(function(x){document.getElementById('lang-'+x).classList.toggle('active',x===l);});
}

function switchTab(tab){
  document.getElementById('tbLogin').classList.toggle('active',tab==='login');
  document.getElementById('tbReg').classList.toggle('active',tab==='register');
  document.getElementById('tbAdmin').classList.toggle('active',tab==='admin');
  document.getElementById('panelLogin').classList.toggle('active',tab==='login');
  document.getElementById('panelReg').classList.toggle('active',tab==='register');
  document.getElementById('panelAdmin').classList.toggle('active',tab==='admin');
}

function doRegister(){
  var name=document.getElementById('reg-name').value.trim();
  var pin=document.getElementById('reg-pin').value.trim();
  setErr('reg-err',''); setOk('reg-ok','');
  if(!name){setErr('reg-err','Digite seu nome.');return;}
  if(!/^\d{4}$/.test(pin)){setErr('reg-err','A senha deve ter exatamente 4 dígitos.');return;}
  if(!db){setErr('reg-err','Sem conexão com o servidor.');return;}
  showLoad('VERIFICANDO...');
  db.collection('players').doc(name).get().then(function(snap){
    if(snap.exists){
      hideLoad();
      setErr('reg-err','Este nome já está cadastrado. Escolha outro nome.');
      return;
    }
    var p={name:name,pin:pin,totalCorrect:0,totalPlayed:0,bestPct:{},levelsDone:[],highestLevel:'awozito',status:'pending'};
    db.collection('players').doc(name).set(p).then(function(){
      hideLoad();
      document.getElementById('reg-name').value='';
      document.getElementById('reg-pin').value='';
      setOk('reg-ok','✓ Cadastro enviado! Aguarde aprovação do admin.');
    }).catch(function(){hideLoad();setErr('reg-err','Erro ao salvar. Tente novamente.');});
  }).catch(function(){hideLoad();setErr('reg-err','Erro de conexão.');});
}

function doLogin(){
  var name=document.getElementById('login-name').value.trim();
  var pin=document.getElementById('login-pin').value.trim();
  setErr('login-err','');
  if(!name){setErr('login-err','Digite seu nome.');return;}
  if(!pin){setErr('login-err','Digite sua senha.');return;}
  if(!db){setErr('login-err','Sem conexão com o servidor.');return;}
  showLoad('VERIFICANDO...');
  db.collection('players').doc(name).get().then(function(snap){
    if(!snap.exists){hideLoad();setErr('login-err','Nome não encontrado. Cadastre-se primeiro.');return;}
    var p=snap.data();
    if(p.pin!==pin){hideLoad();setErr('login-err','Senha incorreta.');return;}
    if(p.status==='pending'){hideLoad();setErr('login-err','⏳ Cadastro aguardando aprovação do administrador.');return;}
    if(p.status==='rejected'){hideLoad();setErr('login-err','❌ Cadastro recusado. Fale com o administrador.');return;}
    CUR.player=p;
    hideLoad();
    showLobby();
  }).catch(function(){hideLoad();setErr('login-err','Erro de conexão.');});
}

function doLogout(){
  CUR.player=null;
  document.getElementById('login-name').value='';
  document.getElementById('login-pin').value='';
  showScreen('screen-start');
}

function doAdminLogin(){
  var pin=document.getElementById('admin-pin').value.trim();
  setErr('admin-err','');
  if(pin!==ADMIN_PIN){setErr('admin-err','Senha incorreta.');return;}
  if(!db){setErr('admin-err','Sem conexão.');return;}
  showLoad('CARREGANDO...');
  db.collection('players').get().then(function(snap){
    hideLoad();
    var all=snap.docs.map(function(d){return d.data();});
    var pending=all.filter(function(p){return p.status==='pending';});
    var approved=all.filter(function(p){return p.status==='approved'||!p.status;});
    var pendingEl=document.getElementById('admin-pending');
    var approvedEl=document.getElementById('admin-approved');
    if(pending.length===0){
      pendingEl.innerHTML='<div style="color:rgba(255,255,255,0.4);font-size:0.9rem;padding:0.8rem 0;">Nenhum cadastro pendente.</div>';
    } else {
      pendingEl.innerHTML=pending.map(function(p){
        return '<div class="admin-card"><div class="admin-card-name">'+p.name+'</div><div class="admin-btns"><button class="btn-approve" onclick="approveUser(\''+p.name+'\')">✓ Aprovar</button><button class="btn-reject" onclick="rejectUser(\''+p.name+'\')">✕ Recusar</button></div></div>';
      }).join('');
    }
    if(approved.length===0){
      approvedEl.innerHTML='<div style="color:rgba(255,255,255,0.4);font-size:0.9rem;padding:0.8rem 0;">Nenhum aprovado ainda.</div>';
    } else {
      approvedEl.innerHTML=approved.map(function(p){
        return '<div style="background:rgba(0,50,0,0.3);border:1px solid rgba(255,215,0,0.1);border-radius:10px;padding:0.7rem 1rem;margin-bottom:0.5rem;display:flex;align-items:center;justify-content:space-between;"><span style="font-family:Cinzel,serif;font-size:0.92rem;color:rgba(255,255,255,0.7);">'+p.name+'</span><span style="font-size:0.75rem;color:#7fff7f;">✓</span></div>';
      }).join('');
    }
    showScreen('screen-admin');
  }).catch(function(){hideLoad();setErr('admin-err','Erro de conexão.');});
}

function approveUser(name){
  showLoad('APROVANDO...');
  db.collection('players').doc(name).update({status:'approved'}).then(function(){
    hideLoad();
    doAdminLogin();
  }).catch(function(){hideLoad();alert('Erro ao aprovar.');});
}

function rejectUser(name){
  if(confirm('Recusar o cadastro de '+name+'?')){
    showLoad('RECUSANDO...');
    db.collection('players').doc(name).update({status:'rejected'}).then(function(){
      hideLoad();
      doAdminLogin();
    }).catch(function(){hideLoad();alert('Erro ao recusar.');});
  }
}

function showLobby(){
  var p=CUR.player;
  var pct=p.totalPlayed>0?Math.round(p.totalCorrect/p.totalPlayed*100):0;
  var lvIdx=LEVELS.findIndex(function(l){return l.id===p.highestLevel;});
  var lvName=lvIdx>=0?LEVELS[lvIdx].name:'Awozito';
  document.getElementById('lobby-name').textContent='Bem-vindo, '+p.name+'!';
  document.getElementById('lobby-stats').textContent=p.totalCorrect+' acertos · '+p.totalPlayed+' jogadas · '+pct+'% · Nível: '+lvName;
  var grid=document.getElementById('levels-grid');
  grid.innerHTML='';
  LEVELS.forEach(function(lv,idx){
    var unlocked=idx===0||(p.bestPct&&p.bestPct[LEVELS[idx-1].id]===100);
    var done=p.levelsDone&&p.levelsDone.indexOf(lv.id)>=0;
    var best=p.bestPct&&p.bestPct[lv.id]!=null?p.bestPct[lv.id]:null;
    var div=document.createElement('div');
    div.className='lv-card '+(unlocked?'open':'locked');
    if(unlocked){
      (function(lvc,idxc){div.onclick=function(){startLevel(lvc,idxc);};})(lv,idx);
    }
    var badgeClass=done?'badge-done':unlocked?'badge-open':'badge-lock';
    var badgeText=done?'✓ Completo':unlocked?'Jogar':'🔒';
    var nameEl=unlocked?'<span class="lv-name">'+lv.icon+' '+lv.name+' — '+lv.q+' perguntas</span>':'<span class="lv-name-locked">'+lv.icon+' '+lv.name+' — '+lv.q+' perguntas</span>';
    var barHTML=best!=null?'<div class="lv-bar-wrap"><div class="lv-bar-fill" style="width:'+best+'%"></div></div><div class="lv-best">Melhor: '+best+'%'+(best===100?' · ✓ Desbloqueou próximo nível':' · Precisa de 100% para avançar')+'</div>':'';
    div.innerHTML='<div class="lv-header">'+nameEl+'<span class="lv-badge '+badgeClass+'">'+badgeText+'</span></div><div class="lv-desc" style="'+(unlocked?'':'color:rgba(255,255,255,0.2)')+'">'+lv.desc+'</div>'+barHTML+(unlocked?'':'<span class="lv-lock-icon">🔒</span>');
    grid.appendChild(div);
  });
  showScreen('screen-lobby');
}

function showRanking(){
  showLoad('CARREGANDO RANKING...');
  db.collection('players').get().then(function(snap){
    hideLoad();
    var all=snap.docs.map(function(d){return d.data();}).filter(function(p){return p.status==='approved'||!p.status;});
    all.sort(function(a,b){
      if(b.totalCorrect!==a.totalCorrect)return b.totalCorrect-a.totalCorrect;
      var pa=a.totalPlayed>0?a.totalCorrect/a.totalPlayed:0;
      var pb=b.totalPlayed>0?b.totalCorrect/b.totalPlayed:0;
      return pb-pa;
    });
    var list=document.getElementById('ranking-list');
    if(!all.length){list.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.3);padding:2rem;">Nenhum jogador ainda.</div>';}
    else{
      list.innerHTML=all.map(function(p,i){
        var pct=p.totalPlayed>0?Math.round(p.totalCorrect/p.totalPlayed*100):0;
        var nc=i===0?'g1':i===1?'g2':i===2?'g3':'';
        var init=p.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
        var lvIdx=LEVELS.findIndex(function(l){return l.id===p.highestLevel;});
        var lvName=lvIdx>=0?LEVELS[lvIdx].name:'Awozito';
        return '<div class="rank-item"><div class="rank-num '+nc+'">'+(i+1)+'º</div><div class="rank-avatar">'+init+'</div><div class="rank-info"><div class="rank-name-el">'+p.name+'</div><div class="rank-sub">'+lvName+' · '+p.totalPlayed+' jogadas</div></div><div style="text-align:right"><div class="rank-pts">'+p.totalCorrect+'</div><div class="rank-pct">'+pct+'%</div></div></div>';
      }).join('');
    }
    showScreen('screen-ranking');
  }).catch(function(){hideLoad();alert('Erro ao carregar ranking.');});
}

function startLevel(lv,idx){
  CUR.level=lv;CUR.lvIdx=idx;
  CUR.qs=sh(DB).slice(0,lv.q);
  CUR.qi=0;CUR.score=0;CUR.startMs=Date.now();
  if(CUR.tmr)clearInterval(CUR.tmr);
  CUR.tmr=setInterval(function(){
    var s=Math.floor((Date.now()-CUR.startMs)/1000);
    document.getElementById('gtimer-val').textContent=fmt(s);
    document.getElementById('gtimer').classList.toggle('urgent',s>300);
  },1000);
  loadQ();
  showScreen('screen-quiz');
}

function wrongOpts(co){
  var others=[];
  for(var i=0;i<16;i++){if(i!==co)others.push(i);}
  others=sh(others).slice(0,3);
  return others.map(function(odu){return sh(DB.filter(function(d){return d.o===odu;}))[0];});
}

function loadQ(){
  if(CUR.qi>=CUR.qs.length){finishQuiz();return;}
  var q=CUR.qs[CUR.qi];
  var total=CUR.qs.length;
  document.getElementById('qh-name').innerHTML='Jogador: <span>'+CUR.player.name+'</span>';
  document.getElementById('qh-counter').textContent=(CUR.qi+1)+'/'+total;
  document.getElementById('score-live').textContent='✓ '+CUR.score;
  document.getElementById('progress-fill').style.width=Math.round(CUR.qi/total*100)+'%';
  var card=document.getElementById('question-card');
  card.className='question-card fade-in';void card.offsetWidth;
  document.getElementById('q-maxima').textContent='"'+q.t+'"';
  var wrongs=wrongOpts(q.o);
  var allOpts=sh([{c:q.c,o:q.o}].concat(wrongs));
  var letters=['A','B','C','D'];
  document.getElementById('options-list').innerHTML=allOpts.map(function(opt,i){
    return '<button class="opt-btn" data-ok="'+(opt.c===q.c?'1':'0')+'" data-odu="'+q.o+'"><span class="opt-letter">'+letters[i]+')</span>'+opt.c+'</button>';
  }).join('');
  document.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.addEventListener('click',function(){pickAnswer(btn,q);});
  });
  document.getElementById('feedback-bar').className='feedback-bar';
  document.getElementById('feedback-bar').textContent='';
  document.getElementById('btn-next').style.display='none';
}

function pickAnswer(btn,q){
  if(document.getElementById('btn-next').style.display==='block')return;
  var isOk=btn.getAttribute('data-ok')==='1';
  document.querySelectorAll('.opt-btn').forEach(function(b){
    b.disabled=true;
    if(b.getAttribute('data-ok')==='1')b.classList.add('correct');
  });
  if(!isOk){btn.classList.add('wrong');btn.classList.add('shake');}
  var fb=document.getElementById('feedback-bar');
  if(isOk){
    CUR.score++;
    document.getElementById('score-live').textContent='✓ '+CUR.score;
    fb.className='feedback-bar correct show';
    fb.textContent='✓ Correto! ('+ODUS[q.o].name+')';
  } else {
    fb.className='feedback-bar wrong show';
    fb.textContent='✗ Era: '+q.c+' — '+ODUS[q.o].name;
  }
  document.getElementById('btn-next').style.display='block';
}

function nextQ(){CUR.qi++;loadQ();}

function finishQuiz(){
  if(CUR.tmr){clearInterval(CUR.tmr);CUR.tmr=null;}
  var total=CUR.qs.length,score=CUR.score;
  var pct=Math.round(score/total*100);
  var lv=CUR.level,p=CUR.player;
  p.totalCorrect=(p.totalCorrect||0)+score;
  p.totalPlayed=(p.totalPlayed||0)+total;
  if(!p.bestPct)p.bestPct={};
  if(p.bestPct[lv.id]==null||pct>p.bestPct[lv.id])p.bestPct[lv.id]=pct;
  if(!p.levelsDone)p.levelsDone=[];
  if(pct===100&&p.levelsDone.indexOf(lv.id)<0)p.levelsDone.push(lv.id);
  var newUnlock=null;
  if(pct===100&&CUR.lvIdx<LEVELS.length-1){
    var nxt=LEVELS[CUR.lvIdx+1];
    var alreadyUnlocked=p.bestPct&&p.bestPct[lv.id]>=100;
    if(!alreadyUnlocked)newUnlock=nxt;
  }
  var lvOrder=LEVELS.map(function(l){return l.id;});
  if(CUR.lvIdx>lvOrder.indexOf(p.highestLevel||'awozito'))p.highestLevel=lv.id;
  CUR.player=p;
  showLoad('SALVANDO...');
  db.collection('players').doc(p.name).set(p).then(function(){hideLoad();doShowResult(lv,score,total,pct,newUnlock);}).catch(function(){hideLoad();doShowResult(lv,score,total,pct,newUnlock);});
}

function doShowResult(lv,score,total,pct,newUnlock){
  var msgObj=PCT_MSGS.find(function(m){return pct>=m.min&&pct<=m.max;})||PCT_MSGS[PCT_MSGS.length-1];
  document.getElementById('result-lv').textContent=lv.icon+' '+lv.name;
  document.getElementById('result-big').textContent=score+'/'+total;
  document.getElementById('result-pct').textContent=pct+'%';
  document.getElementById('result-msg').textContent=msgObj.msg;
  var ub=document.getElementById('unlock-box');
  if(newUnlock){ub.style.display='block';document.getElementById('unlock-name').textContent=newUnlock.icon+' '+newUnlock.name+' desbloqueado!';}
  else ub.style.display='none';
  showScreen('screen-result');
}

function retryLevel(){if(CUR.level)startLevel(CUR.level,CUR.lvIdx);}
</script>
