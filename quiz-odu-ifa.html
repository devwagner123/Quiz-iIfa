<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste</title>
<style>
body{background:#002200;color:white;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;}
button{padding:1rem 2rem;font-size:1.2rem;cursor:pointer;background:#FFD700;border:none;border-radius:8px;font-weight:bold;}
#msg{font-size:1.5rem;color:#FFD700;}
</style>
</head>
<body>
<div id="msg">Clique no botão</div>
<button onclick="testar()">TESTAR</button>
<script>
function testar(){
  document.getElementById('msg').textContent = '✓ JavaScript funcionando!';
}
</script>
</body>
</html>
